version: '3.8'

services:

    ${moduleId}-postgres:
        image: postgres:${postgres.docker.version}
        networks:
          ${moduleId}-network:
            aliases:
              - postgres
        restart: unless-stopped
        command: postgres -c max_connections=300
        volumes:
          - ${moduleId}-alf_psql:/srv/postgresql
        environment:
          PGDATA: /srv/postgresql/data
          POSTGRES_DB: alfresco
          POSTGRES_USER: alfresco
          POSTGRES_PASSWORD: alfresco

    ${moduleId}-repository-1:
        image: ${moduleId}-repository:latest
        build:
            context: ./repository
            dockerfile: Dockerfile
        networks:
          ${moduleId}-network:
            aliases:
              - repository-1 
        restart: unless-stopped
        depends_on:
          ${moduleId}-postgres:
            condition: service_started
          ${moduleId}-activemq:
            condition: service_started
          ${moduleId}-transform-core-aio:
            condition: service_started
        volumes:
          - ${moduleId}-contentstore:${alfresco.repo.docker.data.path}
          - ${moduleId}-repo1_logs:${alfresco.repo.docker.tomcat.path}/logs
        ports:
          - 4000:4000
          - ${alfresco.repo.docker.port}:8080
          - ${alfresco.repo.docker.debugPort}:8888
          # identical inner/outer port to support connecting from
          # both inside + outside Docker container network
          - ${alfresco.repo.docker.commPort}:${alfresco.repo.docker.commPort}
          - ${alfresco.repo.docker.discoPort}:${alfresco.repo.docker.discoPort}
          - ${alfresco.repo.docker.timePort}:${alfresco.repo.docker.timePort}
        # disables security manager
        command:
          - catalina.sh
          - run
        environment:
            JAVA_OPTS: >-
              -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:8888
              -Xms2g -Xmx2g -XX:+UseG1GC -XX:+ParallelRefProcEnabled
              -XX:+UseStringDeduplication -XX:+ScavengeBeforeFullGC
              -XX:+DisableExplicitGC -XX:+AlwaysPreTouch
              --add-opens=java.base/java.io=ALL-UNNAMED
              --add-opens=java.base/java.lang=ALL-UNNAMED
              --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
              --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
              --add-opens=java.base/java.math=ALL-UNNAMED
              --add-opens=java.base/java.net=ALL-UNNAMED
              --add-opens=java.base/java.nio=ALL-UNNAMED
              --add-opens=java.base/java.text=ALL-UNNAMED
              --add-opens=java.base/java.time=ALL-UNNAMED
              --add-opens=java.base/java.util=ALL-UNNAMED
              --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
              --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
              --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED
              --add-opens=java.base/javax.crypto=ALL-UNNAMED
              --add-opens=java.base/jdk.internal.access=ALL-UNNAMED
              --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
              --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
              --add-opens=java.base/sun.reflect.generics.reflectiveObjects=ALL-UNNAMED
              --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
              --add-opens=java.management/com.sun.jmx.mbeanserver=ALL-UNNAMED
              --add-opens=java.management/sun.management=ALL-UNNAMED
              --add-opens=jdk.internal.jvmstat/sun.jvmstat.monitor=ALL-UNNAMED
              --add-opens=jdk.management/com.sun.management.internal=ALL-UNNAMED
              -Dfile.encoding=UTF-8
              -Djava.net.preferIPv4Stack=true
              -DIGNITE_PERFORMANCE_SUGGESTIONS_DISABLED=true
              -DIGNITE_QUIET=true
              -DIGNITE_NO_ASCII=true
              -DIGNITE_UPDATE_NOTIFIER=false
              -DIGNITE_JVM_PAUSE_DETECTOR_DISABLED=true
              -DIGNITE_SKIP_CONFIGURATION_CONSISTENCY_CHECK=true
              -Dencryption.keystore.type=JCEKS
              -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
              -Dencryption.keyAlgorithm=DESede
              -Dencryption.keystore.location=${alfresco.repo.docker.tomcat.path}/shared/classes/alfresco/extension/keystore/keystore
              -Dmetadata-keystore.password=mp6yc0UD9e
              -Dmetadata-keystore.aliases=metadata
              -Dmetadata-keystore.metadata.password=oKIWzVdEdA
              -Dmetadata-keystore.metadata.algorithm=DESede
              -Dsolr.secureComms=secret
              -Dsolr.sharedSecret=secret1
              -Drepo.event2.enabled=false
              -Dsystem.enableTimestampPropagation=false
              -D${moduleId}.caches.remoteSupport.enabled=true
              -D${moduleId}.core.local.id=repository-1
              -D${moduleId}.core.local.host=repository-1
              -D${moduleId}.core.local.comm.port=${alfresco.repo.docker.commPort}
              -D${moduleId}.core.local.disco.port=${alfresco.repo.docker.discoPort}
              -D${moduleId}.core.local.time.port=${alfresco.repo.docker.timePort}
              -D${moduleId}.core.storage.defaultStorageRegion.initialSize=268435456
              -D${moduleId}.core.storage.defaultStorageRegion.maxSize=1073741824
              -javaagent:/usr/local/tomcat/glowroot/glowroot.jar
        healthcheck:
            test: curl -f localhost:8080/alfresco/
            interval: 30s
            timeout: 30s
            retries: 3

